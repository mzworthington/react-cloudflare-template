name: CI & Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_cloudflare:
        description: Deploy build to Cloudflare Pages after CI (main only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-pnpm-node
        with:
          version: 11.21.0
          runtime: node@26.7.0
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unused code (knip)
        run: pnpm knip --reporter github-actions

  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-pnpm-node
        with:
          version: 11.21.0
          runtime: node@26.7.0
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Unit tests
        run: pnpm test --coverage

  build:
    runs-on: ubuntu-latest
    needs: [quality, unit-tests]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-pnpm-node
        with:
          version: 11.21.0
          runtime: node@26.7.0
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Build
        env:
          POSTHOG_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.POSTHOG_TOKEN || '' }}
          POSTHOG_HOST: ${{ github.ref == 'refs/heads/main' && 'https://a.mzworthington.co.uk' || '' }}
        run: pnpm build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: app/dist
          retention-days: 7

  deploy:
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy_to_cloudflare)
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: app/dist

      - name: Read Cloudflare account
        id: cloudflare-account
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id=$(awk -F': *' '$1 == "accountId" { print $2; exit }' infra/cloudflare/hosting.yaml)
          if [[ -z "$id" || "$id" == YOUR_* ]]; then
            id="${CLOUDFLARE_ACCOUNT_ID}"
          fi
          if [[ -z "$id" ]]; then
            echo "::error::Set accountId in infra/cloudflare/hosting.yaml or CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cloudflare-account.outputs.id }}
          command: pages deploy app/dist

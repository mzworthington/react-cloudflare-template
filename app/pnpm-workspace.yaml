allowBuilds:
  core-js: false
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - vite
  - '@pulumi/cloudflare'
  - miniflare@5.20260801.1-alpha || 5.20260910.0-alpha
  - wrangler@4.120.0 || 4.131.0
  - tmp
  - undici
  - uuid
  - lodash-es
  - sharp
  - '@testing-library/jest-dom@7.0.1'
  - '@posthog/browser-common@0.8.3'
  - '@posthog/core@1.53.2'
  - '@posthog/types@1.411.1'
  - posthog-js@1.430.2

# Dependabot / transitive security pins (parents that will not unlock).
overrides:
  tmp: '>=0.2.7'
  uuid: '>=11.1.1'
  'undici@7': '7.29.0'
  'undici@8': '>=8.9.0'
  lodash-es: '>=4.18.0'
  sharp: '>=0.35.4'

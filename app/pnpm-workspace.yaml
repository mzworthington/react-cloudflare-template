allowBuilds:
  core-js: set this to true or false
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - vite
  - '@pulumi/cloudflare'
  - miniflare@5.20260801.1-alpha
  - wrangler@4.120.0
  - tmp
  - undici
  - uuid
  - lodash-es
  - '@testing-library/jest-dom@7.0.1'

# Dependabot / transitive security pins (parents that will not unlock).
overrides:
  tmp: '>=0.2.7'
  uuid: '>=11.1.1'
  'undici@7': '7.29.0'
  'undici@8': '>=8.9.0'
  lodash-es: '>=4.18.0'
